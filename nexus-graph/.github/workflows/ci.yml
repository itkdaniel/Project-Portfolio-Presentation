name: CI — nexus-graph

on:
  push:
    branches: [main]
    paths:
      - "nexus-graph/**"
      - "apps/_shared/**"
  pull_request:
    branches: [main]
    paths:
      - "nexus-graph/**"
      - "apps/_shared/**"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-graph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check app/ tests/ --ignore E501,E402

  test:
    name: Tests (unit, graph-engine, quantum, regression, BDD)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-graph
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install nexus-shared (local path)
        run: pip install --no-cache-dir ../apps/_shared

      - name: Install app dev dependencies
        run: pip install ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run BDD tests
        run: pytest tests/bdd/ -v --tb=short

      - name: Run regression tests
        run: pytest tests/regression/ -v --tb=short

  frontend-build:
    name: Frontend TypeScript + Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-graph/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f nexus-graph/Dockerfile -t nexus-graph:ci .
