version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  Development override — hot-reload, local ports, no nginx
#  Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# ─────────────────────────────────────────────────────────────────────────────

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

  python-service:
    volumes:
      - ./python-service:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  ai-service:
    volumes:
      - ./ai-service:/app
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8001

  nexus-quantum:
    volumes:
      - ./apps/nexus-quantum:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8200
  nexus-graph:
    volumes:
      - ./nexus-graph:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8006
    environment:
      # Dev-only fallback so the local hot-reload stack renders out of the box.
      # Production (docker-compose.yml alone) requires an operator-provided token.
      NEXUS_GRAPH_ADMIN_TOKEN: ${NEXUS_GRAPH_ADMIN_TOKEN:-graph-dev-admin-token}
  nexus-analytics:
    volumes:
      - ./apps/nexus-analytics:/app
    command: uvicorn app.main:create_app --factory --reload --host 0.0.0.0 --port 8300
  nexus-crypto:
    volumes:
      - ./apps/nexus-crypto:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8100
  crypto-market:
    volumes:
      - ./apps/crypto-market:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8101
  crypto-wallet:
    volumes:
      - ./apps/crypto-wallet:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8102
  crypto-dex:
    volumes:
      - ./apps/crypto-dex:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8103
  crypto-analytics:
    volumes:
      - ./apps/crypto-analytics:/app
    command: uvicorn app.main:create_app --factory --reload --host 0.0.0.0 --port 8104
