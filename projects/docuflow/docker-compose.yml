version: "3.9"

services:
  api:
    build: .
    command: uvicorn docuflow.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://docuflow:docuflow@postgres:5432/docuflow
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
    volumes:
      - uploads:/tmp/docuflow/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: .
    command: celery -A docuflow.worker worker --loglevel=info --concurrency=4 -Q documents
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://docuflow:docuflow@postgres:5432/docuflow
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/tmp/docuflow/uploads
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      replicas: 2

  flower:
    image: mher/flower:latest
    command: celery flower --broker=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: docuflow
      POSTGRES_PASSWORD: docuflow
      POSTGRES_DB: docuflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads:
