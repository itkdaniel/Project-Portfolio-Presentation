# ─────────────────────────────────────────────────────────────────────────────
# DO NOT commit real values — use kubectl create secret or sealed-secrets
# Replace <base64-encoded-value> with: echo -n "value" | base64
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: nexus-secrets
  namespace: nexusconsult
type: Opaque
data:
  database-url: <base64-encoded-value>
  python-database-url: <base64-encoded-value>
  redis-url: <base64-encoded-value>
  mongo-url: <base64-encoded-value>
  jwt-secret: <base64-encoded-value>