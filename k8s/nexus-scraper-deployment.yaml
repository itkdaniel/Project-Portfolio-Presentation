apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-scraper
  namespace: nexusconsult
  labels:
    app: nexus-scraper
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-scraper
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: nexus-scraper
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nexus-scraper
          image: ghcr.io/YOUR_ORG/nexusconsult/nexus-scraper:latest
          ports:
            - containerPort: 8005
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "8005"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: database-url
            - name: NEXUS_AI_URL
              value: http://nexus-ai-svc:8001
            # Scheduling is handled by the single Kubernetes CronJob below so
            # autoscaled API replicas do not enqueue duplicate trending crawls.
            - name: SCHEDULER_ENABLED
              value: "false"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-scraper-svc
  namespace: nexusconsult
spec:
  selector:
    app: nexus-scraper
  ports:
    - port: 8005
      targetPort: 8005
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexus-scraper-hpa
  namespace: nexusconsult
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexus-scraper
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nexus-scraper-trending
  namespace: nexusconsult
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trigger-trending-scrape
              image: curlimages/curl:8.12.1
              args:
                - --fail
                - --show-error
                - --silent
                - --request
                - POST
                - http://nexus-scraper-svc:8005/v1/scrape/trending
              resources:
                requests:
                  memory: "16Mi"
                  cpu: "10m"
                limits:
                  memory: "32Mi"
                  cpu: "100m"