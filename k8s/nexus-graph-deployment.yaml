apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-graph
  namespace: nexusconsult
  labels:
    app: nexus-graph
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-graph
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: nexus-graph
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nexus-graph
          image: ghcr.io/YOUR_ORG/nexusconsult/nexus-graph:latest
          ports:
            - containerPort: 8006
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "8006"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: database-url
            - name: NEXUS_GRAPH_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: graph-admin-token
            # Fail fast if the Secret key is empty/misprovisioned — the app refuses
            # to start rather than serving graph write endpoints unauthenticated.
            - name: GRAPH_REQUIRE_ADMIN_TOKEN
              value: "1"
            - name: CORS_ORIGINS
              value: '["*"]'
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-graph-svc
  namespace: nexusconsult
spec:
  selector:
    app: nexus-graph
  ports:
    - port: 8006
      targetPort: 8006
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexus-graph-hpa
  namespace: nexusconsult
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexus-graph
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70