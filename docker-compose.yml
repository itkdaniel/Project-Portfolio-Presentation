version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  NexusConsult — Full-Stack Microservices Compose
#  Usage: docker-compose up -d
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-nexus}
      POSTGRES_PASSWORD: ${PGPASSWORD:-nexuspassword}
      POSTGRES_DB: ${PGDATABASE:-nexusdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── Redis (caching + pub-sub) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── Main Web Application (TypeScript/Express) ───────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${PGUSER:-nexus}:${PGPASSWORD:-nexuspassword}@postgres:5432/${PGDATABASE:-nexusdb}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SUB_APP_QUANTUM_URL: http://nexus-quantum:8200
      NEXUS_QUANTUM_URL: http://nexus-quantum:8200
      SUB_APP_GRAPH_URL: http://nexus-graph:8006
      NEXUS_GRAPH_URL: http://nexus-graph:8006
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/projects || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ── Python FastAPI Service ──────────────────────────────────────────────────
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: nexus_python
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${PGUSER:-nexus}:${PGPASSWORD:-nexuspassword}@postgres:5432/${PGDATABASE:-nexusdb}
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  # ── AI/ML Service (PyTorch) ─────────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: nexus_ai
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      MODEL_CHECKPOINT: /app/checkpoints/latest.pt
    ports:
      - "8001:8001"
    volumes:
      - ai_checkpoints:/app/checkpoints
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  # ── MongoDB (for Python service document store) ─────────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: nexus_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-nexus}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongopassword}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nexus_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - web
      - python-service
      - ai-service
      - nexus-quantum
      - nexus-graph
    logging: *default-logging

  # ── Nexus Analytics (Platform API analytics microservice) ──────────────────
  nexus-analytics:
    build:
      context: ./apps
      dockerfile: nexus-analytics/Dockerfile
    container_name: nexus_analytics
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${PGUSER:-nexus}:${PGPASSWORD:-nexuspassword}@postgres:5432/${PGDATABASE:-nexusdb}
      NEXUS_ANALYTICS_URL: http://nexus-analytics:8300
      LOG_LEVEL: INFO
      LOG_FILE: logs/nexus-analytics.jsonl
      CORS_ORIGINS: '["*"]'
    ports:
      - "8300:8300"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8300/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ── Nexus Quantum (Azure Quantum microservice) ─────────────────────────────
  nexus-quantum:
    build:
      context: ./apps/nexus-quantum
      dockerfile: Dockerfile
    container_name: nexus_quantum
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${PGUSER:-nexus}:${PGPASSWORD:-nexuspassword}@postgres:5432/${PGDATABASE:-nexusdb}
      AZURE_QUANTUM_WORKSPACE_ID: ${AZURE_QUANTUM_WORKSPACE_ID:-}
      AZURE_QUANTUM_SUBSCRIPTION_ID: ${AZURE_QUANTUM_SUBSCRIPTION_ID:-}
      AZURE_QUANTUM_RESOURCE_GROUP: ${AZURE_QUANTUM_RESOURCE_GROUP:-}
      AZURE_QUANTUM_WORKSPACE_NAME: ${AZURE_QUANTUM_WORKSPACE_NAME:-}
      AZURE_QUANTUM_LOCATION: ${AZURE_QUANTUM_LOCATION:-eastus}
      NEXUS_QUANTUM_URL: http://nexus-quantum:8200
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      CORS_ORIGINS: '["*"]'
    ports:
      - "8200:8200"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8200/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ── Nexus Graph (knowledge graph microservice) ─────────────────────────────
  nexus-graph:
    build:
      context: .
      dockerfile: nexus-graph/Dockerfile
    container_name: nexus_graph
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${PGUSER:-nexus}:${PGPASSWORD:-nexuspassword}@postgres:5432/${PGDATABASE:-nexusdb}
      PORT: 8006
      CORS_ORIGINS: '["*"]'
      # Operators must provide a secret token; the service refuses to start without one
      # (GRAPH_REQUIRE_ADMIN_TOKEN below). For local development use docker-compose.dev.yml,
      # which supplies a dev-only default.
      NEXUS_GRAPH_ADMIN_TOKEN: ${NEXUS_GRAPH_ADMIN_TOKEN:-}
      GRAPH_REQUIRE_ADMIN_TOKEN: "1"
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8006/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ── NexusCrypto Ecosystem ─────────────────────────────────────────────────────

  nexus-crypto:
    build:
      context: ./apps/nexus-crypto
      dockerfile: Dockerfile
    container_name: nexus_crypto
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${PGUSER:-nexus}:${PGPASSWORD:-nexuspassword}@postgres:5432/nexuscrypto
      NEXUS_CRYPTO_URL: http://nexus-crypto:8100
      JWT_SECRET: ${NEXUS_CRYPTO_JWT_SECRET:-nexus-crypto-jwt-secret-change-in-prod}
      CORS_ORIGINS: '["*"]'
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  crypto-market:
    build:
      context: ./apps/crypto-market
      dockerfile: Dockerfile
    container_name: crypto_market
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${PGUSER:-nexus}:${PGPASSWORD:-nexuspassword}@postgres:5432/cryptomarket
      NEXUS_CRYPTO_MARKET_URL: http://crypto-market:8101
      CORS_ORIGINS: '["*"]'
    ports:
      - "8101:8101"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8101/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  crypto-wallet:
    build:
      context: ./apps/crypto-wallet
      dockerfile: Dockerfile
    container_name: crypto_wallet
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${PGUSER:-nexus}:${PGPASSWORD:-nexuspassword}@postgres:5432/cryptowallet
      NEXUS_CRYPTO_WALLET_URL: http://crypto-wallet:8102
      CORS_ORIGINS: '["*"]'
    ports:
      - "8102:8102"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8102/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  crypto-dex:
    build:
      context: ./apps/crypto-dex
      dockerfile: Dockerfile
    container_name: crypto_dex
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${PGUSER:-nexus}:${PGPASSWORD:-nexuspassword}@postgres:5432/cryptodex
      NEXUS_CRYPTO_DEX_URL: http://crypto-dex:8103
      CORS_ORIGINS: '["*"]'
    ports:
      - "8103:8103"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8103/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  crypto-analytics:
    build:
      context: ./apps/crypto-analytics
      dockerfile: Dockerfile
    container_name: crypto_analytics
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${PGUSER:-nexus}:${PGPASSWORD:-nexuspassword}@postgres:5432/cryptoanalytics
      NEXUS_CRYPTO_ANALYTICS_URL: http://crypto-analytics:8104
      NEXUS_CRYPTO_URL: http://nexus-crypto:8100
      CORS_ORIGINS: '["*"]'
    ports:
      - "8104:8104"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8104/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  ai_checkpoints:
  nginx_certs: