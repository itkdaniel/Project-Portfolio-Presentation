name: NexusGraph CI

on:
  push:
    paths:
      - "nexus-graph/**"
      - ".github/workflows/nexus-graph-ci.yml"
  pull_request:
    paths:
      - "nexus-graph/**"

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-graph
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff>=0.4.4

      - name: Ruff lint
        run: ruff check app/ tests/

  test:
    name: Pytest (mock DB)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: nexus-graph
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --cov=app --cov-report=term-missing

  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-graph/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: nexus-graph/frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vite build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, frontend-build]
    defaults:
      run:
        working-directory: nexus-graph
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nexus-graph:ci .
