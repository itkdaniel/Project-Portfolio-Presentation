name: nexus-analytics CI

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/nexus-analytics/**"
      - "apps/_shared/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/nexus-analytics/**"
      - "apps/_shared/**"

defaults:
  run:
    working-directory: apps/nexus-analytics

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check app/ tests/

  # ── 2. Unit tests ──────────────────────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared library
        working-directory: apps/_shared
        run: pip install -e .
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: |
          pytest tests/unit/ -v \
            --tb=short \
            --html=test-report-unit.html \
            --self-contained-html \
            --cov=app \
            --cov-report=xml:coverage.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: apps/nexus-analytics/test-report-unit.html
          retention-days: 14
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: apps/nexus-analytics/coverage.xml
          retention-days: 14

  # ── 3. BDD tests ───────────────────────────────────────────────────────────
  bdd:
    name: BDD scenarios
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared library
        working-directory: apps/_shared
        run: pip install -e .
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run BDD tests
        run: |
          pytest tests/bdd/ -v \
            --tb=short \
            --html=test-report-bdd.html \
            --self-contained-html
      - name: Upload BDD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-test-report
          path: apps/nexus-analytics/test-report-bdd.html
          retention-days: 14

  # ── 4. Regression tests ────────────────────────────────────────────────────
  regression:
    name: Regression / contract tests
    runs-on: ubuntu-latest
    needs: [unit, bdd]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared library
        working-directory: apps/_shared
        run: pip install -e .
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run regression tests
        run: pytest tests/regression/ -v --tb=short

  # ── 5. Docker build ────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: regression
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build \
            -f nexus-analytics/Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/nexus-analytics:${{ github.sha }} \
            .
