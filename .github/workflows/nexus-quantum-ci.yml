name: Nexus Quantum CI

on:
  push:
    paths:
      - "apps/nexus-quantum/**"
      - ".github/workflows/nexus-quantum-ci.yml"
  pull_request:
    paths:
      - "apps/nexus-quantum/**"

jobs:
  lint:
    name: Ruff lint + mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nexus-quantum

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install ruff>=0.4.4 mypy>=1.10.0

      - name: Ruff lint
        run: ruff check app/ tests/

      - name: mypy type check
        run: mypy app/ --ignore-missing-imports --no-strict-optional

  unit:
    name: Unit + BDD + Regression tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: apps/nexus-quantum

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Run BDD tests
        run: pytest tests/bdd/ -v

      - name: Run regression contract tests
        run: pytest tests/regression/ -v -m regression

  e2e:
    name: E2E integration tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: apps/nexus-quantum

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run E2E tests (SQLite in-memory)
        run: pytest tests/e2e/ -v -m e2e

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    defaults:
      run:
        working-directory: apps/nexus-quantum

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nexus-quantum:ci .
