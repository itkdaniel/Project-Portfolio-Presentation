name: nexus-scraper CI

on:
  push:
    paths:
      - "nexus-scraper/**"
      - ".github/workflows/nexus-scraper-ci.yml"
  pull_request:
    paths:
      - "nexus-scraper/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-scraper

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: pip install ruff>=0.4.4 mypy>=1.10.0

      - name: Ruff lint
        run: ruff check app/ tests/

      - name: mypy type check
        run: mypy app/ --ignore-missing-imports --no-strict-optional

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: nexus-scraper

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]" pytest-html

      - name: Run unit tests
        run: |
          if [ -d tests/unit ]; then
            pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term-missing --html=reports/test-report.html --self-contained-html
          else
            pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --html=reports/test-report.html --self-contained-html
          fi

      - name: Upload test HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-nexus-scraper-${{ github.run_id }}
          path: nexus-scraper/reports/test-report.html
          retention-days: 14

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit-nexus-scraper-${{ github.run_id }}
          path: nexus-scraper/coverage.xml
          retention-days: 14

  bdd:
    name: BDD tests (pytest-bdd)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: nexus-scraper

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]" pytest-bdd

      - name: Run BDD tests (if present)
        run: |
          if [ -d tests/bdd ]; then
            pytest tests/bdd/ -v --gherkin-terminal-reporter
          else
            echo "No BDD tests directory found — skipping"
          fi

      - name: Upload BDD HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdd-report-nexus-scraper-${{ github.run_id }}
          path: nexus-scraper/reports/
          retention-days: 14

  regression:
    name: Regression / contract tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: nexus-scraper

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run regression tests (if present)
        run: |
          if [ -d tests/regression ]; then
            pytest tests/regression/ -v -m regression
          else
            echo "No regression tests directory found — skipping"
          fi

  docker:
    name: Docker build + tag
    runs-on: ubuntu-latest
    needs: [unit, bdd, regression]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./nexus-scraper
          push: false
          tags: ghcr.io/itkdaniel/nexus-scraper:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
