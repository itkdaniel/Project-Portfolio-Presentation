name: Nexus Scraper CI

on:
  push:
    paths:
      - "nexus-scraper/**"
  pull_request:
    paths:
      - "nexus-scraper/**"

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-scraper

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app/ tests/

      - name: Run tests
        run: pytest tests/ -v --cov=app --cov-report=term-missing

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: nexus-scraper

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nexus-scraper:ci .
