name: CI — Test, Lint & Build

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # ── TypeScript / Node tests ──────────────────────────────────────────────
  test-node:
    name: Node.js — Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexuspassword
          POSTGRES_DB: nexustest
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://nexus:nexuspassword@localhost:5432/nexustest
      JWT_SECRET: test-secret-ci

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit & regression tests
        run: npx vitest run tests/unit tests/regression --reporter=verbose

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-coverage
          path: coverage/

  # ── Python tests ─────────────────────────────────────────────────────────
  test-python:
    name: Python — FastAPI Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexuspassword
          POSTGRES_DB: nexustest
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://nexus:nexuspassword@localhost:5432/nexustest
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-ci

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: python-service/requirements.txt

      - name: Install Python dependencies
        working-directory: python-service
        run: pip install -r requirements.txt pytest pytest-asyncio httpx pytest-cov

      - name: Run Python tests
        working-directory: python-service
        run: pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload Python coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: python-service/coverage.xml

  # ── Docker build (validate only — no push) ───────────────────────────────
  build-docker:
    name: Docker Build (validate)
    runs-on: ubuntu-latest
    needs: [test-node, test-python]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: nexusconsult/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Python service image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./python-service
          push: false
          tags: nexusconsult/python-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
