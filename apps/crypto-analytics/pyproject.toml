[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "crypto-analytics"
version = "0.2.0"
description = "Crypto Analytics — portfolio analytics, P&L tracking, and quantum optimization microservice"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "structlog>=24.1.0",
    "nexus-shared",
]

[project.optional-dependencies]
quantum = [
    "nexus-shared",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-bdd>=7.0.0",
    "httpx>=0.27.0",
    "anyio[trio]>=4.0.0",
    "aiosqlite>=0.20.0",
    "nexus-shared",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
