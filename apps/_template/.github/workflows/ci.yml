# ─────────────────────────────────────────────────────────────────────────────
# Canonical CI template for NexusConsult sub-apps.
# Copy to .github/workflows/nexus-{name}-ci.yml and replace:
#   APP_NAME  →  e.g. nexus-tax
#   APP_PATH  →  e.g. apps/nexus-tax
# ─────────────────────────────────────────────────────────────────────────────
name: "{APP_NAME} CI"

on:
  push:
    paths:
      - "{APP_PATH}/**"
      - ".github/workflows/{APP_NAME}-ci.yml"
  pull_request:
    paths:
      - "{APP_PATH}/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: {APP_PATH}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: pip install ruff>=0.4.4 mypy>=1.10.0

      - name: Ruff lint
        run: ruff check app/ tests/

      - name: mypy type check
        run: mypy app/ --ignore-missing-imports --no-strict-optional

  # ── Unit tests ──────────────────────────────────────────────────────────────
  unit:
    name: Unit tests (SQLite in-memory)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: {APP_PATH}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pytest-html

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term-missing --html=reports/test-report.html --self-contained-html

      - name: Upload test HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-{APP_NAME}-${{ github.run_id }}
          path: {APP_PATH}/reports/test-report.html
          retention-days: 14

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit-{APP_NAME}-${{ github.run_id }}
          path: {APP_PATH}/coverage.xml
          retention-days: 14

  # ── BDD tests ───────────────────────────────────────────────────────────────
  bdd:
    name: BDD tests (pytest-bdd)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: {APP_PATH}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run BDD tests
        run: pytest tests/bdd/ -v --gherkin-terminal-reporter

      - name: Upload BDD HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdd-report-{APP_NAME}-${{ github.run_id }}
          path: {APP_PATH}/reports/
          retention-days: 14

  # ── Regression tests ────────────────────────────────────────────────────────
  regression:
    name: Regression / contract tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: {APP_PATH}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run regression tests
        run: pytest tests/regression/ -v -m regression

  # ── Docker build ─────────────────────────────────────────────────────────────
  docker:
    name: Docker build + tag
    runs-on: ubuntu-latest
    needs: [unit, bdd, regression]
    defaults:
      run:
        working-directory: {APP_PATH}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./{APP_PATH}
          push: false
          tags: ghcr.io/itkdaniel/{APP_NAME}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
