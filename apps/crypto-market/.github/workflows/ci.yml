name: "crypto-market CI"

on:
  push:
    paths:
      - "apps/crypto-market/**"
      - ".github/workflows/crypto-market-ci.yml"
  pull_request:
    paths:
      - "apps/crypto-market/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/crypto-market

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: pip install ruff>=0.4.4 mypy>=1.10.0

      - name: Ruff lint
        run: ruff check app/ tests/

      - name: mypy type check
        run: mypy app/ --ignore-missing-imports --no-strict-optional

  tests:
    name: Tests (Unit + BDD + E2E)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: apps/crypto-market

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run all tests
        run: pytest tests/ -v
