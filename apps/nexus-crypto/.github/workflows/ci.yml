name: "nexus-crypto CI"

on:
  push:
    paths:
      - "apps/nexus-crypto/**"
      - ".github/workflows/nexus-crypto-ci.yml"
  pull_request:
    paths:
      - "apps/nexus-crypto/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nexus-crypto

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: pip install ruff>=0.4.4 mypy>=1.10.0

      - name: Ruff lint
        run: ruff check app/ tests/

      - name: mypy type check
        run: mypy app/ --ignore-missing-imports --no-strict-optional

  unit:
    name: Unit tests (SQLite in-memory)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: apps/nexus-crypto

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]" pytest-html

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term-missing --html=reports/test-report.html --self-contained-html

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: apps/nexus-crypto

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run E2E tests
        run: pytest tests/e2e/ -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    defaults:
      run:
        working-directory: apps/nexus-crypto

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/nexus-crypto
          push: false
          tags: nexus-crypto:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
