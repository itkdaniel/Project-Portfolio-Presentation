[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nexus-ai"
version = "0.1.0"
description = "PyTorch transformer inference service for NexusConsult"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "torch>=2.3.0",
    "numpy>=1.26.4",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "python-jose[cryptography]>=3.3.0",
    "structlog>=24.1.0",
    "nexus-shared",
]

[project.optional-dependencies]
quantum = [
    "nexus-shared",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-bdd>=7.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "anyio[trio]>=4.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "nexus-shared",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
select = ["E", "W", "F", "I"]
ignore = ["E501", "W503"]
