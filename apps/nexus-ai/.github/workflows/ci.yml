name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nexus-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check app/ tests/ --ignore E501,E402

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nexus-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install nexus-shared (local path)
        run: pip install --no-cache-dir ../_shared
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: pytest tests/unit/ tests/ddt/ tests/regression/ -v --tb=short
        env:
          PYTHONPATH: .

  bdd:
    name: BDD Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nexus-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install nexus-shared (local path)
        run: pip install --no-cache-dir ../_shared
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run BDD tests
        run: pytest tests/bdd/ -v --tb=short
        env:
          PYTHONPATH: .

  e2e:
    name: E2E Tests (mock model)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nexus-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install nexus-shared (local path)
        run: pip install --no-cache-dir ../_shared
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run E2E tests
        run: pytest tests/e2e/ -v --tb=short
        env:
          PYTHONPATH: .

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [unit, bdd, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: apps
          file: apps/nexus-ai/Dockerfile
          push: false
          tags: nexus-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
