version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nexus-ai:
    build:
      context: ..
      dockerfile: nexus-ai/Dockerfile
    expose:
      - "8001"
    environment:
      - REDIS_URL=redis://redis:6379
      - MODEL_CHECKPOINT=${MODEL_CHECKPOINT:-}
      - DEVICE=auto
      - DEBUG=false
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
