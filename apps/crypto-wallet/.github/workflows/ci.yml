# ─────────────────────────────────────────────────────────────────────────────
# Canonical CI template for NexusConsult sub-apps.
# ─────────────────────────────────────────────────────────────────────────────
name: "crypto-wallet CI"

on:
  push:
    paths:
      - "apps/crypto-wallet/**"
      - ".github/workflows/crypto-wallet-ci.yml"
  pull_request:
    paths:
      - "apps/crypto-wallet/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/crypto-wallet

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check app/ tests/

  # ── Unit tests ──────────────────────────────────────────────────────────────
  unit:
    name: Unit tests (SQLite in-memory)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: apps/crypto-wallet

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install .[dev]

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=app

  # ── BDD tests ───────────────────────────────────────────────────────────────
  bdd:
    name: BDD tests (pytest-bdd)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: apps/crypto-wallet

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install .[dev]

      - name: Run BDD tests
        run: pytest tests/bdd/ -v

  # ── Regression tests ────────────────────────────────────────────────────────
  regression:
    name: Regression / contract tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: apps/crypto-wallet

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install .[dev]

      - name: Run regression tests
        run: pytest tests/regression/ -v

  # ── Docker build ─────────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [unit, bdd, regression]
    defaults:
      run:
        working-directory: apps/crypto-wallet

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/crypto-wallet
          push: false
          tags: crypto-wallet:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
